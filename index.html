<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referendariat Jahresplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap">
<style>
/* Layout: sanfte Pastell-Arbeitsfläche, Kopfzeile mit globalem Filter, Start-Dashboard mit Bannern, Details nur im Seiten-Drawer */
:root{
  --bg:#fbf7f3; --surface:#ffffff; --sunken:#f5efea; --line:#eee5de; --line-2:#ddd1c8;
  --fg:#3a3340; --muted:#7b7181; --faint:#aba2b0; --ink:#4b3f63;
  --d:#c25b6a; --d-soft:#fbe3e6; --m:#4f7cb8; --m-soft:#e1ecfa; --e:#3f936b; --e-soft:#dcf2e6;
  --lav:#8b74c9; --lav-soft:#ede7fb; --peach:#fbe2d2; --butter:#fcf0c8; --mint:#d8f1e5; --sky:#deebfb; --rose:#fbe1e7;
  --ub:#d0912c; --ub-soft:#fcefd2; --gap:#d0603f;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Quicksand","Nunito",system-ui,sans-serif;
  --kid:"Andika","Nunito",system-ui,sans-serif;
  --r:16px; --shadow:0 12px 40px rgba(75,63,99,.14); --soft:0 2px 10px rgba(75,63,99,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1a22; --surface:#26222c; --sunken:#2e2935; --line:#3a3442; --line-2:#4a4353;
  --fg:#efe9f3; --muted:#b4aabb; --faint:#7f7686; --ink:#d9cdf5;
  --d:#f0a3ad; --d-soft:#43262c; --m:#a8c5ef; --m-soft:#22324a; --e:#9bd8b8; --e-soft:#1f3a2e;
  --lav:#c3b2f2; --lav-soft:#332b48; --peach:#4a362c; --butter:#463e26; --mint:#213b31; --sky:#233249; --rose:#46282f;
  --ub:#efc06a; --ub-soft:#4a3b1f; --gap:#f29a7c; --shadow:0 12px 40px rgba(0,0,0,.5); --soft:0 2px 10px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1a22; --surface:#26222c; --sunken:#2e2935; --line:#3a3442; --line-2:#4a4353;
  --fg:#efe9f3; --muted:#b4aabb; --faint:#7f7686; --ink:#d9cdf5;
  --d:#f0a3ad; --d-soft:#43262c; --m:#a8c5ef; --m-soft:#22324a; --e:#9bd8b8; --e-soft:#1f3a2e;
  --lav:#c3b2f2; --lav-soft:#332b48; --peach:#4a362c; --butter:#463e26; --mint:#213b31; --sky:#233249; --rose:#46282f;
  --ub:#efc06a; --ub-soft:#4a3b1f; --gap:#f29a7c; --shadow:0 12px 40px rgba(0,0,0,.5); --soft:0 2px 10px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--m);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.f-D{--fc:var(--d);--fs:var(--d-soft)} .f-M{--fc:var(--m);--fs:var(--m-soft)} .f-E{--fc:var(--e);--fs:var(--e-soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fc);display:inline-block;flex:none}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:400;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--sunken);color:var(--fg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:9px 12px 11px;color:var(--muted);text-decoration:none;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--ink);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunken);color:var(--fg)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--gap)}
.btn.f{border-color:color-mix(in srgb,var(--fc) 45%,transparent);color:var(--fc)}

main{padding-block:26px 120px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{background:var(--sunken);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.note b{color:var(--fg)}
.empty{text-align:center;padding:38px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--fs,var(--sunken));color:var(--fc,var(--fg));border:1px solid transparent;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.chip button{border:0;background:transparent;color:inherit;padding:0 0 0 2px;font-size:14px;line-height:1}
.chip.add{background:transparent;border:1px dashed var(--line-2);color:var(--muted);font-weight:400}
.chip.ub{background:transparent;color:var(--ub);border-color:color-mix(in srgb,var(--ub) 40%,transparent)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.tip{position:fixed;z-index:80;max-width:320px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:var(--shadow)}
.tip b{display:block;font-size:11px;letter-spacing:.06em;opacity:.75;margin-bottom:2px}

/* Woche */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.weeknav .lbl{min-width:210px;text-align:center}
.combo{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.combo-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.combo-h h3{display:flex;align-items:center;gap:8px}
.unitline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.unitline a{color:var(--fg);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line-2)}
.unitline a:hover{border-color:var(--fc)}
.phase{font-size:12px;color:var(--muted);background:var(--sunken);padding:2px 8px;border-radius:999px}
.lessons{display:flex;flex-direction:column}
.lesson{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.lesson:hover .lt{color:var(--fc,var(--m))}
.lesson .ld{font-size:13px;color:var(--muted)}
.lesson .lt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.lesson .lt small{display:block;font-weight:400;color:var(--muted)}
.star{color:var(--ub)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.todaylist .lesson{grid-template-columns:auto 1fr auto}

/* Jahresplan */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.yp{--cw:26px;display:grid;grid-template-columns:104px repeat(var(--n),var(--cw));row-gap:6px;min-width:max-content;padding-bottom:6px}
.yp .lab{position:sticky;left:0;background:var(--surface);z-index:3;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;padding-right:8px}
.yp .mon{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;border-left:1px solid var(--line);padding-left:4px}
.yp .wk{font-size:10px;color:var(--faint);text-align:center;border:0;background:none;padding:0;font-variant-numeric:tabular-nums}
.yp .wk.now{color:var(--fg);font-weight:700}
.yp .bg{height:34px;border-radius:4px}
.yp .bg.fer{background:repeating-linear-gradient(135deg,var(--sunken) 0 4px,transparent 4px 8px)}
.yp .bg.buf{background:var(--sunken)}
.yp .bg.nowc{box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg-u{height:34px;background:var(--fs);color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 30%,transparent);border-radius:6px;font-size:12px;font-weight:700;padding:0 6px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-align:left;z-index:2;position:relative}
.seg-u:hover{border-color:var(--fc)}
.seg-u .cnt{margin-left:auto;font-size:11px;background:var(--surface);color:var(--fc);border-radius:999px;padding:0 6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

/* Kompetenzraster */
.kg{border-collapse:separate;border-spacing:0;font-size:13px}
.kg th,.kg td{padding:0}
.kg .rh{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 12px 4px 0;min-width:230px;max-width:230px;font-weight:400}
.kg .rh .c{font-weight:700;color:var(--fc);display:inline-block;width:38px}
.kg .rh .t{color:var(--muted);font-size:12px;display:inline-block;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.kg thead th{font-size:10px;color:var(--faint);font-weight:400;height:26px;vertical-align:bottom;font-variant-numeric:tabular-nums}
.kg thead th.now{color:var(--fg);font-weight:700}
.kg .grp td{padding:14px 0 6px}
.kg .grp .gh{position:sticky;left:0;display:inline-block;background:var(--surface);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:12px;white-space:nowrap}
.cell{width:24px;height:24px;margin:1px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);padding:0}
.cell:hover{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cell.p{background:var(--fs)}
.cell.t{background:var(--fc);color:var(--surface)}
.cell.t.op{opacity:.9}
.cell.x{background:color-mix(in srgb,var(--fc) 55%,var(--surface))}
.kg td.tb{border-left:2px solid var(--line)}
.kg td.cur{background:color-mix(in srgb,var(--sunken) 70%,transparent)}
.kg .sum{padding-left:12px;white-space:nowrap;color:var(--muted);font-size:12px}
.gapp{color:var(--gap);font-weight:700}
.balance{display:flex;gap:10px;flex-wrap:wrap}
.bal{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);min-width:150px;flex:1;max-width:100%}
.bal .terms{display:flex;gap:4px;margin-top:6px}
.bal .terms span{flex:1;text-align:center;font-size:11px;border-radius:4px;padding:2px 0;background:var(--sunken);color:var(--muted);font-variant-numeric:tabular-nums}
.bal .terms span.on{background:var(--fs);color:var(--fc);font-weight:700}
.bal .terms span.zero{color:var(--gap)}

/* Einheiten */
.ucard{padding:14px 16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;gap:8px;width:100%}
.ucard:hover{border-color:var(--line-2)}
.ucard h3{font-size:15px}
.ucard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.cov{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.cov i{display:block;height:100%;background:var(--fc)}
.grp-h{display:flex;align-items:center;gap:8px;margin:22px 0 10px}

/* Archiv */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.input,select.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.search{flex:1;min-width:180px}
.arch .lesson{grid-template-columns:96px 1fr auto;padding:10px 4px}
.month{margin:20px 0 4px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}
.dh .t h2{overflow-wrap:anywhere}
.db{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;flex:1}
.df{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl2{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:baseline}
.ib{font-weight:400;font-size:11px;color:var(--faint);letter-spacing:.02em}
.fld input:not([type=checkbox]),.fld textarea,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--line-2);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--m) 15%,transparent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
details.sec{border-top:1px solid var(--line);padding-top:12px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ic{transition:transform .15s;width:16px;height:16px;color:var(--faint)}
details.sec[open]>summary .ic{transform:rotate(90deg)}
details.sec>.in{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.link{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.picker{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pk{flex-basis:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:320px;overflow:auto;background:var(--bg);margin-top:4px}
.pk h4{margin:8px 4px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pk button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px;border-radius:6px;font-size:13px;align-items:flex-start}
.pk button:hover{background:var(--sunken)}
.pk button .cc{font-weight:700;color:var(--fc);min-width:34px}
.pk button[aria-pressed="true"]{background:var(--fs)}
.wprow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.wprow .wd{font-size:12.5px;color:var(--muted)}
.wprow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;width:100%;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ub)}
.toggle.on{border-color:color-mix(in srgb,var(--ub) 50%,transparent);background:color-mix(in srgb,var(--ub) 8%,transparent)}
.saved{font-size:12.5px;color:var(--faint);margin-right:auto}
.covlist{display:flex;flex-direction:column;gap:6px}
.covrow{display:grid;grid-template-columns:48px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-size:12px;color:var(--muted);letter-spacing:.04em}
.std{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.std .c{font-weight:700;color:var(--fc)}
.std textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.fab{display:none}
/* ---- Pastell-Schicht ---- */
h1,h2,h3,.brand,.eyebrow{font-family:var(--display)}
h1{font-size:26px;letter-spacing:-.01em}
.brand{font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--rose),var(--lav-soft));display:grid;place-items:center;color:var(--ink)}
.panel{border-radius:var(--r);box-shadow:var(--soft);border-color:var(--line)}
.btn{border-radius:999px;font-weight:700}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 25%,transparent)}
.btn.soft{background:var(--lav-soft);border-color:transparent;color:var(--ink)}
.btn.ub{background:var(--ub-soft);border-color:transparent;color:var(--fg)}
.seg{background:var(--sunken)}
nav.tabs a[aria-current="page"]{border-color:var(--lav)}
.chip{border-radius:999px}
.banner{position:relative;overflow:hidden;border-radius:24px;padding:26px 26px 24px;background:linear-gradient(120deg,var(--rose) 0%,var(--lav-soft) 45%,var(--sky) 100%);display:flex;flex-direction:column;gap:8px;min-height:150px}
.banner.ubb{background:linear-gradient(120deg,var(--butter) 0%,var(--peach) 55%,var(--rose) 100%)}
.banner h1{font-size:28px;max-width:30ch;position:relative;z-index:1}
.banner p{margin:0;max-width:52ch;color:var(--muted);position:relative;z-index:1}
.banner .quote{font-family:var(--display);font-weight:600;color:var(--ink);font-size:15.5px}

const syncedSettings=()=>{const o={...S.settings};LOCAL_ONLY.forEach(k=>delete o[k]);return o};

 el.className='sync '+({ok:'ok',busy:'busy',err:'err',load:'busy'}[st]||'');el.innerHTML=`<i></i>${t}`;el.title=msg||(st==='local'?'Daten liegen nur in diesem Browser. Sichere per Export.':'Synchronisiert über deine Geräte');}
function saveBase(){try{localStorage.setItem(SBKEY,JSON.stringify({settings:SY.known.settings,units:SY.known.units,seminars:SY.known.seminars,extras:SY.known.extras,lessons:[...SY.known.lessons.keys()]}))}catch(e){}}
function scheduleSync(){if(!SY.db||!SY.ready)return;clearTimeout(SY.timer);SY.timer=setTimeout(flushSync,900)}
async function flushSync(){if(!SY.db||!SY.ready)return;if(SY.busy){SY.again=true;return}SY.busy=true;setSync('busy');
 try{const st=canon(syncedSettings());if(st!==SY.known.settings){await SY.refs.settings.set({v:JSON.parse(st),t:Date.now()});SY.known.settings=st}
  const un=canon(S.units);if(un!==SY.known.units){if(un.length>250000)throw {code:'too_big',message:'Die Einheiten sind zu umfangreich für einen Speicherblock.'};await SY.refs.units.set({v:JSON.parse(un),t:Date.now()});SY.known.units=un}
  for(const k of ['seminars','extras']){const c=canon(S[k]);if(c!==SY.known[k]){if(c.length>250000)throw {message:(k==='seminars'?'Die Seminarnotizen':'Aufgaben und Ideen')+' sind zu umfangreich für einen Speicherblock.'};await SY.refs[k].set({v:JSON.parse(c),t:Date.now()});SY.known[k]=c}}
  const ids=new Set();for(const L of S.lessons){ids.add(L.id);const j=canon(L);if(SY.known.lessons.get(L.id)!==j){await SY.refs.lessons.doc(L.id).set(JSON.parse(j));SY.known.lessons.set(L.id,j)}}
  for(const id of [...SY.known.lessons.keys()])if(!ids.has(id)){await SY.refs.lessons.doc(id).delete();SY.known.lessons.delete(id)}
  saveBase();setSync('ok')}
 catch(e){setSync('err',e&&e.code==='quota_exceeded'?'Speicher voll – bitte alte Materialien oder Stunden löschen.':(e&&e.message)||'Speichern fehlgeschlagen – lokal ist alles gesichert.')}
 finally{SY.busy=false;if(SY.again){SY.again=false;scheduleSync()}}}
async function initCloud(){if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
 setSync('load');
 try{const [db,user,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);SY.assets=assets;
  if(!db||!user){setSync('local');render();return}
  const id=await user.id();if(!id){setSync('local');render();return}
  const base='data/users/'+id;SY.db=db;SY.refs={settings:db.doc(base+'/settings'),units:db.doc(base+'/units'),seminars:db.doc(base+'/seminars'),extras:db.doc(base+'/extras'),lessons:db.doc(base+'/journal').collection('lessons')};
  const [s,u,l,sem,ex]=await Promise.all([SY.refs.settings.get(),SY.refs.units.get(),SY.refs.lessons.get(),SY.refs.seminars.get(),SY.refs.extras.get()]);
  let sb={};try{sb=JSON.parse(localStorage.getItem(SBKEY)||'{}')}catch(e){}
  const localSet=canon(syncedSettings()),localUn=canon(S.units);
  if(s.exists){const r=canon(s.data().v||{});if(localSet===sb.settings||r!==sb.settings){Object.assign(S.settings,JSON.parse(r));SY.known.settings=r}else SY.known.settings=r}
  if(u.exists){const r=canon(u.data().v||[]);if(localUn===sb.units||r!==sb.units){S.units=JSON.parse(r).map(x=>blankUnit(x));SY.known.units=r}else SY.known.units=r}
  for(const [k,snap] of [['seminars',sem],['extras',ex]]){if(!snap.exists)continue;const r=canon(snap.data().v);const loc=canon(S[k]);SY.known[k]=r;if(loc===sb[k]||r!==sb[k])S[k]=JSON.parse(r)}
  ensureExtras();
  const remote=new Map(l.docs.map(d=>[d.id,d.data()]));const wasSynced=new Set(sb.lessons||[]);const merged=[];
  for(const [rid,data] of remote){const loc=S.lessons.find(x=>x.id===rid);const rc=canon(data);SY.known.lessons.set(rid,rc);
   merged.push(loc&&(loc.u||0)>(data.u||0)?loc:JSON.parse(rc))}
  for(const L of S.lessons)if(!remote.has(L.id)&&!wasSynced.has(L.id))merged.push(L);
  S.lessons=merged;localSave();buildCal();relinkAll();SY.ready=true;render();await flushSync();
  subscribeCloud()}
 catch(e){setSync('err',(e&&e.message)||'Verbindung fehlgeschlagen – lokal wird weiter gespeichert.')}}
function subscribeCloud(){
 SY.refs.lessons.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;let ch=false;const remote=new Map();
  for(const d of snap.docs){const data=d.data();const c=canon(data);remote.set(d.id,c);const loc=S.lessons.find(x=>x.id===d.id);
   if(loc&&canon(loc)===c){SY.known.lessons.set(d.id,c);continue}
   if(SY.known.lessons.get(d.id)===c)continue;
   if(CTX&&CTX.obj&&CTX.obj.id===d.id)continue;
   const copy=JSON.parse(c);if(loc)S.lessons[S.lessons.indexOf(loc)]=copy;else S.lessons.push(copy);SY.known.lessons.set(d.id,c);ch=true}
  if(!snap.metadata.fromCache)for(const id of [...SY.known.lessons.keys()])if(!remote.has(id)){S.lessons=S.lessons.filter(x=>x.id!==id);SY.known.lessons.delete(id);ch=true}
  if(ch){dirty();localSave();saveBase();if(!CTX)render()}},()=>setSync('err','Live-Abgleich unterbrochen – Änderungen werden lokal gespeichert.'));
 SY.refs.units.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const c=canon(snap.data().v||[]);if(c===SY.known.units||c===canon(S.units)){SY.known.units=c;return}
  if(CTX&&CTX.type==='unit')return;S.units=JSON.parse(c).map(x=>blankUnit(x));SY.known.units=c;relinkAll();localSave();saveBase();if(!CTX)render()},()=>{});
 for(const k of ['seminars','extras'])SY.refs[k].onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const c=canon(snap.data().v);if(c===SY.known[k]||c===canon(S[k])){SY.known[k]=c;return}
  if(CTX&&(CTX.type==='seminar'||CTX.type==='todos'||CTX.type==='tt'))return;S[k]=JSON.parse(c);ensureExtras();SY.known[k]=c;localSave();saveBase();if(!CTX&&!STG)render()},()=>{});
 SY.refs.settings.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const c=canon(snap.data().v||{});if(c===SY.known.settings||c===canon(syncedSettings())){SY.known.settings=c;return}
  Object.assign(S.settings,JSON.parse(c));SY.known.settings=c;buildCal();relinkAll();localSave();saveBase();if(!CTX)render()},()=>{});}

/* ========= Dateien: Artifact-Dateispeicher, sonst lokal (IndexedDB) ========= */
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('jahresplaner-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
 async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
 async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async del(k){const d=await this.open();return new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=res;t.onerror=res})}};
const OBJURL={};
async function addFile(file){const ok=/^(application\/pdf|image\/)/.test(file.type);if(!ok){toast('Bitte PDF oder Bild hochladen. Canva-Dateien als Link einfügen.');return null}
 if(file.size>20*1024*1024){toast('Die Datei ist größer als 20 MB');return null}
 const m={id:uid(),kind:'file',name:file.name,mime:file.type,size:file.size,added:Date.now()};
 if(SY.assets){try{const r=await SY.assets.upload(file);m.assetId=r.id;m.url=r.url||('/_blob/'+r.id);return m}catch(e){toast(e&&e.code==='quota_exceeded'?'Dateispeicher voll':'Hochladen fehlgeschlagen – speichere lokal');}}
 try{m.local=m.id;await IDB.put(m.id,file);return m}catch(e){toast('Datei konnte nicht gespeichert werden');return null}}

function matKind(m){if(m.kind==='link')return /canva\./i.test(m.url)?'canva':/(youtube\.|youtu\.be|vimeo\.|planet-schule|kika\.de|ardmediathek|zdf\.de|br\.de\/mediathek)/i.test(m.url)?'video':'link';return /pdf/.test(m.mime)?'pdf':'img'}
function matHtml(m,removable){const k=matKind(m);const icon={pdf:'file',canva:'palette',img:'image',link:'link',video:'play'}[k];const sub={pdf:'PDF',canva:'Canva',img:'Bild',link:'Link',video:'Video'}[k]+(m.size?` · ${(m.size/1048576).toFixed(1).replace('.',',')} MB`:'');
 const href=m.url||'#';const th=k==='img'&&m.url?`<img class="th" src="${esc(m.url)}" alt="">`:`<span class="mi">${ic(icon)}</span>`;
 return `<div class="row" style="gap:6px;flex-wrap:nowrap"><a class="mat ${k}" style="flex:1" href="${esc(href)}" target="_blank" rel="noopener" ${m.local?`data-local="${m.local}"`:''}>${th}<span class="mn"><b>${esc(m.name||m.url)}</b><small>${sub}${m.local?' · nur auf diesem Gerät':''}</small></span>${ic('right')}</a>${removable?`<button class="iconbtn" data-act="mat-del" data-id="${m.id}" aria-label="Material entfernen">${ic('x')}</button>`:''}</div>`}
async function hydrateLocal(root=document){for(const a of root.querySelectorAll('a[data-local]')){const k=a.dataset.local;try{if(!OBJURL[k]){const b=await IDB.get(k);if(b)OBJURL[k]=URL.createObjectURL(b)}if(OBJURL[k]){a.href=OBJURL[k];const img=a.querySelector('img.th');if(img)img.src=OBJURL[k]}}catch(e){}}}

/* ========= Kalender ========= */
const DAY=864e5;
const P=s=>{const[y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)};
const I=ms=>new Date(ms).toISOString().slice(0,10);
const dow=ms=>(new Date(ms).getUTCDay()+6)%7;
const todayISO=()=>{const t=new Date();return I(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))};
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const dm=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'};
const dmy=ms=>dm(ms)+new Date(ms).getUTCFullYear();
const longDate=iso=>{const ms=P(iso),d=new Date(ms);return `${WDL[dow(ms)]}, ${d.getUTCDate()}. ${['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getUTCMonth()]} ${d.getUTCFullYear()}`};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return Date.UTC(y,mo-1,da)}
let CAL;
function buildCal(){const s=S.settings,start=P(s.yearStart),end=P(s.yearEnd);
 const fer=s.ferien.map(f=>({n:f.n,a:P(f.a),b:P(f.b||f.a)}));const hol=new Map();
 for(let y=new Date(start).getUTCFullYear();y<=new Date(end).getUTCFullYear();y++){
  [['01-01','Neujahr'],['05-01','Tag der Arbeit'],['10-03','Tag der Deutschen Einheit'],['12-25','1. Weihnachtstag'],['12-26','2. Weihnachtstag']].forEach(([md,n])=>hol.set(P(y+'-'+md),n));
  const e=easter(y);[[-2,'Karfreitag'],[1,'Ostermontag'],[39,'Christi Himmelfahrt'],[50,'Pfingstmontag'],[60,'Fronleichnam']].forEach(([o,n])=>hol.set(e+o*DAY,n));}
 const off=ms=>{for(const f of fer)if(ms>=f.a&&ms<=f.b)return f.n;return hol.get(ms)||null};
 const weeks=[];let term=-1,prevFer=true,sw=0;
 for(let mon=start-dow(start)*DAY;mon<=end;mon+=7*DAY){let school=0;const labels=new Set(),days=[];
  for(let i=0;i<5;i++){const d=mon+i*DAY;const o=(d<start||d>end)?'—':off(d);if(!o)school++;else if(o!=='—')labels.add(o);days.push({ms:d,off:o})}
  const w={i:weeks.length,mon,fri:mon+4*DAY,days,school,labels:[...labels],type:school?'school':'ferien'};
  if(school){if(prevFer)term++;w.term=term;w.sw=++sw;prevFer=false}else prevFer=true;weeks.push(w)}
 weeks.forEach((w,i)=>{if(w.type==='school'){const n=weeks[i+1];if(!n||n.type!=='school')w.buffer=true}});
 CAL={weeks,start,end,school:weeks.filter(w=>w.type==='school'),terms:term+1,off,hol};dirty();}
function weekIdx(iso){if(!iso)return -1;const ms=P(iso);const i=Math.floor((ms-CAL.weeks[0].mon)/(7*DAY));return i>=0&&i<CAL.weeks.length?i:-1}
const wLabel=w=>w.type==='school'?`SW ${w.sw}`:(w.labels[0]||'Ferien');
const wRange=w=>`${dm(w.mon)}–${dm(w.fri)}`;

/* ========= Verknüpfungen ========= */
const CODES={};
function buildCodes(){for(const f in STD)STD[f].forEach(b=>b.items.forEach((t,i)=>{const c=b.k+(i+1);CODES[c]={code:c,fach:f,bk:b.k,bn:b.n,def:t}}))}
const codeText=c=>S.settings.std[c]||CODES[c]?.def||'';
const unitsOf=(f,jg)=>S.units.filter(u=>u.fach===f&&+u.jg===+jg).sort((a,b)=>a.order-b.order);
const unitById=id=>S.units.find(u=>u.id===id);
const combos=()=>{const F=S.settings.filter;const out=[];for(const jg of(F.jg==='all'?[1,2,3,4]:[+F.jg]))for(const f of(F.fach==='all'?['D','M','E']:[F.fach])){if(f==='E'&&jg<3)continue;out.push([f,jg])}return out};
function sched(){if(SCH)return SCH;SCH={byUnit:{},byWeek:{},over:{}};
 const slots=CAL.weeks.filter(w=>w.type==='school'&&!w.buffer).map(w=>w.i);
 for(const f of['D','M','E'])for(const jg of[1,2,3,4]){let p=0;for(const u of unitsOf(f,jg)){const idx=slots.slice(p,p+(+u.weeks||1));p+=(+u.weeks||1);SCH.byUnit[u.id]=idx;if(idx.length<u.weeks)SCH.over[u.id]=true;idx.forEach((wi,k)=>SCH.byWeek[f+jg+'|'+wi]={u,k})}}
 return SCH}
function unitAt(f,jg,wi){const s=sched();const hit=s.byWeek[f+jg+'|'+wi];if(hit)return hit;const w=CAL.weeks[wi];
 if(w&&w.type==='school'&&w.buffer){for(let j=wi-1;j>=0;j--){const h=s.byWeek[f+jg+'|'+j];if(h)return{u:h.u,k:h.k,buffer:true}}}return null}
function defPhase(k,n){if(n===1)return 'Einstimmen & Präsentieren';if(k===0)return PHASEN[0];if(k===n-1)return PHASEN[4];const mid=[PHASEN[1],PHASEN[2],PHASEN[3]];return mid[Math.min(k-1,2)]||PHASEN[2]}
function getWP(u){const n=+u.weeks||1;const cur=Array.isArray(u.wp)?u.wp:[];const out=[];
 for(let k=0;k<n;k++){if(cur[k])out.push(cur[k]);else{const codes=[...u.fokus];(u.weitere||[]).forEach((c,i)=>{if(i%n===k&&!codes.includes(c))codes.push(c)});out.push({phase:defPhase(k,n),codes})}}return out}
function tix(){if(TIX)return TIX;TIX={cell:{},unit:{}};
 for(const L of S.lessons){if(L.unitId)(TIX.unit[L.unitId]??=[]).push(L);for(const c of L.codes||[])(TIX.cell[L.fach+L.jg+'|'+c+'|'+L.wi]??=[]).push(L)}
 return TIX}
function relink(L,prefill){L.codes=(L.codes||[]).filter(c=>CODES[c]?.fach===L.fach);L.wi=weekIdx(L.date);const at=L.wi>=0?unitAt(L.fach,L.jg,L.wi):null;L.unitId=at?at.u.id:null;
 if(prefill){if(at){const wp=getWP(at.u)[at.k];L.phase=at.buffer?'Puffer':wp.phase;L.codes=at.buffer?[]:[...wp.codes]}else{L.phase='';L.codes=[]}}}
function relinkAll(){dirty();S.lessons.forEach(L=>{const keepU=L.unitId&&unitById(L.unitId)&&L._manualUnit;L.wi=weekIdx(L.date);if(!keepU){const at=L.wi>=0?unitAt(L.fach,L.jg,L.wi):null;L.unitId=at?at.u.id:null}})}
const lessonsOfUnit=id=>(tix().unit[id]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
const unitRange=u=>{const idx=sched().byUnit[u.id]||[];if(!idx.length)return 'nicht eingeplant';return `${dm(CAL.weeks[idx[0]].mon)}–${dm(CAL.weeks[idx.at(-1)].fri)}`};

 return blankUnit({fach:f,jg,title:r.title||r.titel||r.Titel||'Einheit',weeks:+(r.weeks||r.wochen||r.Wochen)||3,order:+r.order||ord[k],leitidee:r.leitidee||'',schwerpunkte:r.schwerpunkte||'',kontext:r.kontext||'',leitgedanke:r.leitgedanke||'',forscherfrage:r.forscherfrage||'',

  fokus:arr(r.fokus).slice(0,3),weitere:arr(r.weitere),lernprodukt:r.lernprodukt||'',kriterien:r.kriterien||'',atl:Array.isArray(r.atl)?r.atl:String(r.atl||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean),

  S={version:1,units:data.units.map(u=>blankUnit(u)),lessons:data.lessons,seminars:data.seminars||[],extras:data.extras||{},settings:Object.assign(structuredClone(DEF_SETTINGS),data.settings||{})};ensureExtras()}

 case 'idea-add':{const inp=document.getElementById('idea-in');const v=inp.value.trim();if(!v)break;X.ideas.push({id:uid(),t:v,f:document.getElementById('idea-f').value,unitId:'',link:'',used:false,created:Date.now()});persist();render();document.getElementById('idea-in').focus();break}
 case 'idea-used':{const x=X.ideas.find(y=>y.id===t.dataset.id);x.used=!x.used;persist();render();break}
 case 'idea-del':{if(!t.dataset.ok){t.dataset.ok=1;toast('Nochmal tippen zum Löschen');break}X.ideas=X.ideas.filter(y=>y.id!==t.dataset.id);persist();render();break}
 }});
document.addEventListener('change',e=>{const t=e.target;const ac=t.dataset.actChange;const X=S.extras;if(!ac&&!t.dataset.xf)return;
 if(t.dataset.xf){setPath(X,t.dataset.xf,t.value);persist();return}
 if(ac==='tt-cell'){const c=X.timetable.cells[t.dataset.key]=Object.assign({},X.timetable.cells[t.dataset.key]);c[t.dataset.part]=t.value.trim();saveExtras();return}
 if(ac==='todo-done'){const list=t.dataset.sem?(S.seminars.find(s=>s.id===t.dataset.sem)||{}).tasks||[]:X.todos;const x=list.find(y=>y.id===t.dataset.id);if(x){x.done=t.checked;persist();if(t.checked)toast('Erledigt ✓');if(CTX)drawRender();else render()}return}
 if(ac==='idea-unit'){const x=X.ideas.find(y=>y.id===t.dataset.id);x.unitId=t.value;persist();toast(t.value?'Der Einheit zugeordnet':'Zuordnung entfernt');return}
 if(ac==='jar-goal'){X.klasse.reward.goal=Math.max(1,parseInt(t.value)||1);persist();render();return}
 if(ac==='jar-prize'){X.klasse.reward.prize=t.value;persist();return}
 if(ac==='day-note'){dayItems();S.extras.klasse.day.note=t.value;persist();return}
 if(/^day-/.test(ac)){const it=dayItems()[+t.dataset.i];if(!it)return;if(ac==='day-z'){t.value=normTime(t.value)}it[{['day-e']:'e',['day-t']:'t',['day-z']:'z'}[ac]]=t.value;X.klasse.day.auto=false;persist();
  const chips=document.querySelector('#view .card .row');if(chips)chips.innerHTML=dayItems().map(x=>`<span class="chip" style="background:var(--sky);color:var(--fg);font-size:13px;padding:5px 10px">${x.e} ${esc(x.t)}</span>`).join('');return}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f&&/^periods\.\d+\.\d$/.test(f)&&CTX&&CTX.type==='tt'){e.target.value=normTime(e.target.value);setPath(CTX.obj,f,e.target.value);persist()}});
let NOTE_T;document.addEventListener('input',e=>{if(e.target.id==='day-note'){dayItems();S.extras.klasse.day.note=e.target.value;clearTimeout(NOTE_T);NOTE_T=setTimeout(persist,600)}});
document.addEventListener('input',e=>{if(e.target.dataset.lib==='q'){LIBQ=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('libq');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['todo-in','semtask-in','idea-in'].includes(e.target.id)){e.preventDefault();document.querySelector({'todo-in':'[data-act="todo-add"]','semtask-in':'[data-act="semtask-add"]','idea-in':'[data-act="idea-add"]'}[e.target.id]).click();return}
 if(!STG)return;if(e.key==='Escape'){e.stopImmediatePropagation();closeStage();return}
 if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(STG.type==='lesson'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const k=STG.i+(e.key==='ArrowRight'?1:-1);if(k>=0&&k<(STG.L.vrows||[]).length){setPhase(k);renderStage()}}
 if(STG.type==='day'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();STG.i=Math.max(0,Math.min(dayItems().length-1,STG.i+(e.key==='ArrowRight'?1:-1)));renderStage()}
 if(e.key===' '&&STG.type==='lesson'&&STG.total){e.preventDefault();document.querySelector('[data-act="stg-run"]')?.click()}},true);

function route(){const h=location.hash.slice(1);TAB=VIEWS.some(v=>v[0]===h)?h:'start';render()}
addEventListener('hashchange',()=>{if(CTX&&!(CTX.type==='lesson'&&CTX.isNew&&CTX.touched)){CTX=null;document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on')}route();scrollTo(0,0)});

/* ========= Start ========= */
buildCodes();load();buildCal();relinkAll();route();setSync('local');initCloud();
</script>
